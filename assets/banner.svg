<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171c"/>
      <stop offset="0.6" stop-color="#121216"/>
      <stop offset="1" stop-color="#1c1418"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9db4ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9db4ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#fundo)"/>

  <!-- a bolinha: disco branco que solta anéis, igual o assistente de voz -->
  <circle cx="190" cy="150" r="110" fill="url(#brilho)"/>
  <g fill="none" stroke="#ffffff">
    <circle cx="190" cy="150" r="34" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="34;105" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="190" cy="150" r="34" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="34;105" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="190" cy="150" r="34" fill="#ffffff">
    <animate attributeName="r" values="34;38;33;36;34" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'Instrument Sans', Inter, 'Segoe UI', system-ui, sans-serif">
    <text x="360" y="138" font-size="64" font-weight="600" fill="#ececf1" letter-spacing="-1">remynz</text>
    <text x="362" y="186" font-size="24" fill="#8a8a96">Information Systems @ USP · Linux · mobile · tools that feel native</text>
  </g>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="16" fill="#5d5d6a">
    <text x="362" y="232">~ $ ./build --cleaner --faster --prettier</text>
  </g>
</svg>
