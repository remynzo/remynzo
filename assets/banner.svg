<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17171c"/><stop offset="0.6" stop-color="#121216"/><stop offset="1" stop-color="#1c1418"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9db4ff" stop-opacity="0.35"/><stop offset="1" stop-color="#9db4ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pontos" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" opacity="0.045"/></pattern>
    <clipPath id="c0"><rect x="405.2" y="214" height="30" width="0"><animate attributeName="width" values="0;0;334.8;334.8;0;0" keyTimes="0.0000;0.0000;0.0996;0.2143;0.2357;1.0000" dur="14.0s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c1"><rect x="405.2" y="214" height="30" width="0"><animate attributeName="width" values="0;0;388.8;388.8;0;0" keyTimes="0.0000;0.2500;0.3657;0.4643;0.4857;1.0000" dur="14.0s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c2"><rect x="405.2" y="214" height="30" width="0"><animate attributeName="width" values="0;0;442.8;442.8;0;0" keyTimes="0.0000;0.5000;0.6318;0.7143;0.7357;1.0000" dur="14.0s" repeatCount="indefinite"/></rect></clipPath><clipPath id="c3"><rect x="405.2" y="214" height="30" width="0"><animate attributeName="width" values="0;0;280.8;280.8;0;0" keyTimes="0.0000;0.7500;0.8336;0.9643;0.9857;1.0000" dur="14.0s" repeatCount="indefinite"/></rect></clipPath>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#fundo)"/>
  <rect width="1200" height="300" rx="24" fill="url(#pontos)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="23.5" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>

  <!-- a bolinha: disco branco que solta anéis, igual o assistente de voz -->
  <circle cx="190" cy="150" r="110" fill="url(#brilho)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="4s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="#ffffff">
    <circle cx="190" cy="150" r="34" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="34;105" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="190" cy="150" r="34" stroke-width="1.5" opacity="0">
      <animate attributeName="r" values="34;105" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.55;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
    </circle>
  </g>
  <circle cx="190" cy="150" r="34" fill="#ffffff">
    <animate attributeName="r" values="34;38;33;36;34" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <g font-family="'Instrument Sans', Inter, 'Segoe UI', system-ui, sans-serif">
    <text x="360" y="124" font-size="62" font-weight="600" fill="#ececf1" letter-spacing="-1">Enzo Rebello</text>
    <text x="362" y="170" font-size="23" fill="#8a8a96">Information Systems @ USP · remynz</text>
  </g>
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18">
    <text x="362" y="236" fill="#9db4ff">~&#160;$&#160;</text>
    <g fill="#c9c9d3"><text x="405.2" y="236" clip-path="url(#c0)">building tools that feel native</text><text x="405.2" y="236" clip-path="url(#c1)">shipping React Native apps with Expo</text><text x="405.2" y="236" clip-path="url(#c2)">teaching my desktop to talk (with Claude)</text><text x="405.2" y="236" clip-path="url(#c3)">ricing Hyprland on CachyOS</text></g>
    <rect x="405.2" y="219" width="9" height="21" fill="#9db4ff">
      <animate attributeName="x" values="405.2;405.2;740.0;740.0;405.2;405.2;794.0;794.0;405.2;405.2;848.0;848.0;405.2;405.2;686.0;686.0;405.2;405.2" keyTimes="0.0000;0.0000;0.0996;0.2143;0.2357;0.2500;0.3657;0.4643;0.4857;0.5000;0.6318;0.7143;0.7357;0.7500;0.8336;0.9643;0.9857;1.0000" dur="14.0s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
